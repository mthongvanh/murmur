# The package's own options, so it is analysed the same way wherever it
# sits, not under those of the app around it.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# Rules on top of flutter_lints. Leans toward catching bugs (async, streams,
# dynamic calls) and keeping the public API documented and typed, and away
# from pure style rules the formatter already settles.
linter:
  rules:
    # Errors and async hygiene.
    - avoid_dynamic_calls
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements

    # Public API.
    - always_declare_return_types
    - comment_references
    - type_annotate_public_apis

    # Style.
    - avoid_unused_constructor_parameters
    - directives_ordering
    - missing_whitespace_between_adjacent_strings
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants

    # Flutter.
    - sized_box_shrink_expand
    - use_colored_box
    - use_decorated_box
