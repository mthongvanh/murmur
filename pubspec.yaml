name: murmur
description: Voice-reactive and determinate loading indicators for Flutter, painted in Dart with CustomPainter.
version: 0.4.0
repository: https://github.com/mthongvanh/murmur
issue_tracker: https://github.com/mthongvanh/murmur/issues
topics:
  - animation
  - audio
  - voice
  - loading
  - widget
screenshots:
  - description: Aurora orb voice indicator reacting to sound.
    path: doc/gifs/aurora_orb.gif
  - description: Spectrum halo voice indicator reacting to sound.
    path: doc/gifs/spectrum_halo.gif
  - description: Contour bloom loading indicator filling from 0 to 100%.
    path: doc/gifs/loading_contour_bloom.gif
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
